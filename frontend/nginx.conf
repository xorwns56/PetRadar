server {
    listen 80;

    # SPA: 정적 파일이 없으면 index.html로 넘겨 React Router가 처리하도록
    location / {
        root /usr/share/nginx/html;
        try_files $uri $uri/ /index.html;
    }

    # 업로드된 이미지는 백엔드를 거치지 않고 nginx가 직접 서빙한다
    # (backend와 같은 볼륨을 읽기 전용으로 공유)
    location /images/ {
        alias /usr/share/nginx/images/;
        # 업로드마다 새 파일명(UUID)이라 같은 URL의 내용이 바뀌지 않으므로 길게 캐싱해도 안전하다
        expires 30d;
    }

    # API 요청은 백엔드로 전달
    # /api/ws(SockJS)도 이 경로를 타므로 WebSocket 업그레이드 헤더를 함께 전달한다
    location /api/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
