# 운영 로그 포맷.
#
# 맨 앞을 $time_iso8601로 두는 이유: 도커 awslogs 드라이버는 "날짜로 시작하는 줄"을
# 새 로그 이벤트로 판단한다(awslogs-datetime-format). Spring과 MySQL은 이미
# ISO8601로 시작하므로 nginx까지 맞추면, 호스트 설정 한 곳에서 자바 스택트레이스를
# 한 덩어리로 묶을 수 있다. 기본 combined 포맷은 IP로 시작해 그 규칙에 걸리지 않는다.
#
# $request_time을 함께 남긴다. 기본 포맷에는 응답 시간이 없어서 "어떤 요청이
# 느렸나"를 되짚을 수 없었다.
#
# conf.d 안의 파일은 http 컨텍스트라 여기서 정의할 수 있다. 같은 이름을 두 번
# 정의하면 기동에 실패하므로 이 파일에만 둔다(항상 존재하는 default.conf다).
log_format cloudwatch '$time_iso8601 $remote_addr $status $request_time '
                      '"$request" $body_bytes_sent "$http_referer"';

server {
    listen 80;

    # Let's Encrypt 도메인 소유 확인용 경로.
    # certbot이 여기에 파일을 놓고, Let's Encrypt가 외부에서 접속해 확인한다.
    # 인증서 발급 전에도 열려 있어야 하므로 기본 설정에 둔다
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    include /etc/nginx/nginx-routes.conf;
}
