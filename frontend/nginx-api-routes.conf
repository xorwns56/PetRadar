# 정적 파일 서빙을 뺀 나머지 라우팅.
# 운영(nginx-routes.conf)과 개발(nginx-dev.conf)이 함께 include 한다.
#
# location / 만 둘이 다르다 — 운영은 빌드된 파일을 서빙하고,
# 개발은 Vite dev 서버로 넘긴다. 그 외에는 같아야 하므로 여기 모아 둔다.

# 업로드된 이미지는 백엔드를 거치지 않고 nginx가 직접 서빙한다
# (backend와 같은 볼륨을 읽기 전용으로 공유)
location /images/ {
    alias /usr/share/nginx/images/;
    # 업로드마다 새 파일명(UUID)이라 같은 URL의 내용이 바뀌지 않으므로 길게 캐싱해도 안전하다
    expires 30d;
}

# 재색인 등 내부 전용 경로는 외부에 노출하지 않는다
# (컨테이너 네트워크 안에서 backend:8080으로 직접 호출한다)
location /api/internal/ {
    return 404;
}

# API 요청은 백엔드로 전달
# /api/ws(SockJS)도 이 경로를 타므로 WebSocket 업그레이드 헤더를 함께 전달한다
location /api/ {
    proxy_pass http://backend:8080;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
}
