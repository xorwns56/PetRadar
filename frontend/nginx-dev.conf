# 로컬 개발용 nginx 설정 (docker-compose.dev.yml에서 마운트한다).
#
# 운영과 다른 점은 location / 하나뿐이다.
#   운영 — 빌드된 정적 파일을 디스크에서 서빙
#   개발 — Vite dev 서버로 넘긴다 (빌드 결과가 없고 살아 있는 프로세스다)
#
# /images, /api 라우팅은 운영과 같은 파일(nginx-api-routes.conf)을 쓴다.
server {
    listen 80;

    location / {
        proxy_pass http://frontend:5173;
        proxy_set_header Host $host;

        # Vite의 핫리로드는 WebSocket으로 동작한다.
        # 이 헤더가 없으면 화면은 뜨지만 저장해도 반영되지 않는다
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    include /etc/nginx/nginx-api-routes.conf;
}
