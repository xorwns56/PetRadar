# 운영 라우팅 규칙.
# HTTP(80)와 HTTPS(443) 양쪽 server 블록에서 include 해서 쓴다.

# 이미지 기본값(combined, /var/log/nginx/access.log)을 덮어쓴다.
# access_log는 같은 레벨에서는 더해지고 아래 레벨에서 다시 쓰면 교체되므로,
# server 안에서 지정해야 요청이 두 번 기록되지 않는다.
# 포맷 정의는 nginx.conf에 있다
access_log /dev/stdout cloudwatch;

# SPA: 정적 파일이 없으면 index.html로 넘겨 React Router가 처리하도록
location / {
    root /usr/share/nginx/html;
    try_files $uri $uri/ /index.html;
}

# /images, /api 등은 개발 환경과 같은 규칙을 쓴다
include /etc/nginx/nginx-api-routes.conf;
