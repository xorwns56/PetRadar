# HTTPS 설정. 인증서를 발급받은 뒤 서버에서 마운트해 사용한다.
# 인증서 파일이 없으면 nginx가 기동에 실패하므로 이미지에는 넣지 않는다.

# HTTP로 들어온 요청은 HTTPS로 넘긴다.
# 기본 설정(nginx.conf)의 80 블록은 server_name이 없어 기본값으로 동작하고,
# server_name이 명시된 이 블록이 해당 도메인 요청을 먼저 가져간다
server {
    listen 80;
    server_name petradar.site www.petradar.site;

    # 이 블록은 nginx-routes.conf를 include하지 않아 포맷을 물려받지 못한다.
    # 그렇다고 여기서 cloudwatch 포맷을 쓰면 안 된다 — 이 파일은 호스트에서
    # 마운트되고 포맷 정의는 이미지 안(nginx.conf)에 있어서, git pull로 이 파일만
    # 새것이 되고 이미지가 아직 구버전이면 nginx가 "unknown log format"으로
    # 기동에 실패한다. 그러면 사이트가 내려간다.
    #
    # 끄는 쪽을 택한다. 리다이렉트 뒤에는 같은 요청이 HTTPS로 다시 와서 그쪽이
    # 제대로 기록되므로 잃는 정보가 없고, 기본 포맷으로 남겨 두면 IP로 시작해
    # awslogs가 앞 이벤트에 붙여 버린다
    access_log off;

    # 갱신 때도 챌린지 경로는 열려 있어야 하므로 리다이렉트에서 제외한다
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name petradar.site www.petradar.site;

    ssl_certificate     /etc/letsencrypt/live/petradar.site/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/petradar.site/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    include /etc/nginx/nginx-routes.conf;
}
