spring.config.import=optional:file:.env[.properties]

spring.application.name=PetRadar

spring.datasource.url=jdbc:mysql://localhost:3306/petradar_db?serverTimezone=Asia/Seoul&characterEncoding=UTF-8
spring.datasource.username=root
spring.datasource.password=0000
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect

spring.elasticsearch.uris=http://localhost:9200

# 이미지 업로드
# upload-dir: 파일이 실제로 저장되는 경로 (배포 시 컨테이너 볼륨)
# base-url  : DB에 저장된 키 앞에 붙여 응답할 경로. nginx가 이 경로를 서빙한다
#             나중에 S3/CDN으로 옮길 경우 이 값만 교체하면 된다
app.image.upload-dir=./uploads
app.image.base-url=/images

# multipart 업로드 크기 제한
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
