spring.config.import=optional:file:.env[.properties]

spring.application.name=PetRadar

spring.datasource.url=jdbc:mysql://localhost:3306/petradar_db?serverTimezone=Asia/Seoul&characterEncoding=UTF-8
spring.datasource.username=root
spring.datasource.password=0000
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect

spring.elasticsearch.uris=http://localhost:9200

# JWT 서명 키 (HS256이라 32바이트 이상이어야 한다)
# 실제 값은 .env 또는 환경변수로 주입한다. 아래는 로컬 개발용 기본값이다
jwt.access-secret=${JWT_ACCESS_SECRET:local-dev-access-secret-key-please-change-me}
jwt.refresh-secret=${JWT_REFRESH_SECRET:local-dev-refresh-secret-key-please-change}

# Refresh Token 쿠키 속성
# secure: HTTPS에서만 전송. HTTP로 서비스하는 동안 켜면 쿠키가 실리지 않으므로
#         TLS를 붙이는 시점에 true로 바꾼다
app.cookie.secure=${COOKIE_SECURE:false}
app.cookie.same-site=${COOKIE_SAME_SITE:Lax}

# 이미지 업로드
# upload-dir: 파일이 실제로 저장되는 경로 (배포 시 컨테이너 볼륨)
# base-url  : DB에 저장된 키 앞에 붙여 응답할 경로. nginx가 이 경로를 서빙한다
#             나중에 S3/CDN으로 옮길 경우 이 값만 교체하면 된다
app.image.upload-dir=./uploads
app.image.base-url=/images

# multipart 업로드 크기 제한
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
