spring.config.import=optional:file:.env[.properties]

spring.application.name=PetRadar

# 아래 값들은 로컬 개발용 기본값이다. 배포 시에는 환경변수로 덮어쓴다
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/petradar_db?serverTimezone=Asia/Seoul&characterEncoding=UTF-8}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
# 이미지에 실제 비밀번호가 담기지 않도록 기본값을 두지 않는다.
# 로컬에서는 .env 또는 환경변수로 지정한다
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect

# JWT 서명 키 (HS256이라 32바이트 이상이어야 한다)
# 실제 값은 .env 또는 환경변수로 주입한다. 아래는 로컬 개발용 기본값이다
jwt.access-secret=${JWT_ACCESS_SECRET:local-dev-access-secret-key-please-change-me}
jwt.refresh-secret=${JWT_REFRESH_SECRET:local-dev-refresh-secret-key-please-change}

# Refresh Token 쿠키 속성
# secure: HTTPS에서만 전송. HTTP로 서비스하는 동안 켜면 쿠키가 실리지 않으므로
#         TLS를 붙이는 시점에 true로 바꾼다
app.cookie.secure=${COOKIE_SECURE:false}
app.cookie.same-site=${COOKIE_SAME_SITE:Lax}

# 이미지 업로드
# upload-dir: 파일이 실제로 저장되는 경로 (배포 시 컨테이너 볼륨)
# base-url  : DB에 저장된 키 앞에 붙여 응답할 경로. nginx가 이 경로를 서빙한다
#             나중에 S3/CDN으로 옮길 경우 이 값만 교체하면 된다
app.image.upload-dir=./uploads
app.image.base-url=/images

# 공공데이터포털(data.go.kr) 보호소·유기동물 조회 인증키.
# 저장소에 기본값을 두지 않는다 — .env 또는 환경변수로 주입한다
app.shelter.service-key=${DATA_GO_KR_SERVICE_KEY:}

# 국가동물보호정보시스템 두 서비스.
#   animal : 보호 중인 동물. 보호소 주소는 주지만 좌표가 없다
#   center : 센터의 좌표. careRegNo로 위와 잇는다
# 한쪽만으로는 지도를 그릴 수 없어 둘 다 쓴다
app.shelter.animal-api-url=https://apis.data.go.kr/1543061/abandonmentPublicService_v2/abandonmentPublic_v2
app.shelter.center-api-url=https://apis.data.go.kr/1543061/animalShelterSrvc_v2/shelterInfo_v2

# 공공 API는 하루 한 번이 아니라 종일 갱신된다. 하루로 잡으면 아침에 들어온
# 아이를 저녁까지 못 본다
app.shelter.cache-ttl-minutes=60

# 캐시를 미리 데우는 주기. 전국 7천 건을 받는 데 17초가 걸리는데, 만료된 뒤에
# 받아오면 그 비용을 그때 들어온 사용자가 치른다. 미리 갱신해 두면 아무도 안 기다린다.
#
# 반드시 TTL(위 60분)보다 짧아야 한다 — 갱신하는 17초 동안에도 기존 캐시가
# 유효해야 들어온 요청이 락을 건너뛰고 즉시 응답된다
app.shelter.refresh-interval-ms=3000000
# 기동 직후 10초 뒤 한 번 데운다. 첫 사용자가 빈 캐시를 만나지 않게
app.shelter.refresh-initial-delay-ms=10000

# 새로 들어온 아이를 살피는 주기. 캐시 주기와 맞춰 외부 호출이 겹치지 않게 한다.
# 기동 직후에는 돌지 않는다 — 첫 적재에 공공 API 호출이 10번 필요하다
app.shelter.watch-interval-ms=3600000
app.shelter.watch-initial-delay-ms=120000

# multipart 업로드 크기 제한
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
