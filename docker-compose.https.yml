# HTTPS 적용용 오버라이드. 인증서를 발급받은 뒤에 함께 사용한다.
#   docker compose -f docker-compose.yml -f docker-compose.https.yml up -d
#
# 최초 발급 절차와 갱신 cron 등록은 README 참고
# (인증서가 없으면 nginx가 기동에 실패하므로 발급을 먼저 해야 한다)

services:
  frontend:
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - uploads:/usr/share/nginx/images:ro
      - ./frontend/nginx-https.conf:/etc/nginx/conf.d/https.conf:ro
      - certbot-conf:/etc/letsencrypt:ro
      - certbot-www:/var/www/certbot:ro

  # 인증서 발급·갱신용. 상주하지 않고 필요할 때 run으로 실행한다.
  # 갱신은 호스트 cron이 주기적으로 호출하고, 성공하면 nginx를 재시작해
  # 새 인증서를 다시 읽게 한다 (nginx는 기동 시 읽은 인증서를 계속 쓴다)
  certbot:
    image: certbot/certbot
    volumes:
      - certbot-conf:/etc/letsencrypt
      - certbot-www:/var/www/certbot

volumes:
  certbot-conf:
  certbot-www:
