services:
  mysql:
    image: mysql:8
    container_name: petradar-mysql
    restart: unless-stopped
    ports:
      # 호스트 루프백에만 바인딩한다. 로컬에서 DB 클라이언트로 붙을 수는 있지만
      # 서버의 공인 IP로는 접근할 수 없다
      - "127.0.0.1:3306:3306"
    environment:
      # 실제 값은 .env에서 주입한다 (.env.example 참고)
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?MYSQL_ROOT_PASSWORD를 .env에 설정해주세요}
      MYSQL_DATABASE: petradar_db
    volumes:
      - mysql-data:/var/lib/mysql
    # MySQL 초기화가 끝나야 백엔드가 접속할 수 있으므로 준비 상태를 확인한다
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 10

  backend:
    # image와 build를 함께 둔다.
    # 로컬: docker compose build 로 직접 빌드하며 이 이름으로 태그된다
    # 서버: docker compose pull 로 GHCR에서 받아 쓴다 (소스 없이도 기동 가능)
    image: ghcr.io/xorwns56/petradar/backend:latest
    build: ./backend
    container_name: petradar-backend
    restart: unless-stopped
    # 호스트에 포트를 열지 않는다. 외부 요청은 nginx(frontend)를 거쳐 들어오고,
    # 내부 전용 경로는 도커 네트워크 안에서만 호출한다
    environment:
      # application.properties의 localhost 설정을 컨테이너 주소로 덮어쓴다
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/petradar_db?serverTimezone=Asia/Seoul&characterEncoding=UTF-8
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_ROOT_PASSWORD:?MYSQL_ROOT_PASSWORD를 .env에 설정해주세요}
      APP_IMAGE_UPLOAD_DIR: /app/uploads
      # 기동 시마다 키가 바뀌면 재배포할 때 전체 사용자가 로그아웃되므로 고정값을 주입한다
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:?JWT_ACCESS_SECRET을 .env에 설정해주세요}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:?JWT_REFRESH_SECRET을 .env에 설정해주세요}
      # HTTPS를 붙이면 .env에서 COOKIE_SECURE=true로 바꾼다
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      # 공공데이터포털 인증키 (보호소·유기동물 조회).
      # 다른 시크릿과 달리 :? 로 기동을 막지 않는다 — 키가 없으면 보호소 화면만
      # 비어 보이고 실종·제보·알림은 그대로 동작하므로, 전체를 못 띄우는 쪽이 더 손해다
      DATA_GO_KR_SERVICE_KEY: ${DATA_GO_KR_SERVICE_KEY:-}
    volumes:
      - uploads:/app/uploads
    depends_on:
      mysql:
        condition: service_healthy

  frontend:
    image: ghcr.io/xorwns56/petradar/frontend:latest
    build: ./frontend
    container_name: petradar-frontend
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      # 백엔드가 저장한 이미지를 nginx가 직접 서빙한다 (읽기 전용)
      - uploads:/usr/share/nginx/images:ro
      # ACME 챌린지 경로. 인증서를 발급받기 전(HTTP만 띄운 상태)에도 nginx가
      # certbot이 놓은 파일을 서빙해야 하므로 https 오버라이드가 아니라 여기에 둔다.
      # 이 마운트가 없으면 nginx는 컨테이너 안의 빈 디렉터리를 보게 되고,
      # Let's Encrypt가 챌린지를 404로 받아 최초 발급이 실패한다
      - certbot-www:/var/www/certbot:ro
    depends_on:
      - backend

volumes:
  mysql-data:
  uploads:
  # 발급·갱신 때 certbot(https 오버라이드)이 쓰고 nginx가 읽는다
  certbot-www:
